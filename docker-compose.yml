services:
  postgres:
    image: postgres:17-alpine
    container_name: opensloth-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: opensloth
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/opensloth
      - AUTH_SECRET=${AUTH_SECRET}
    depends_on:
      - postgres

volumes:
  pgdata:
